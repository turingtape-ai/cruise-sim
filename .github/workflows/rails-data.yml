name: Swiss Rail Live data

# Refreshes public/swiss-rail-live/rails.json (the railway network the live train map
# routes on) from OpenStreetMap. Separate from the game's CI on purpose.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/swiss-rail-live/**', '.github/workflows/rails-data.yml']
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: rails-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/swiss-rail-live/build-rails.mjs
      - name: Commit rails.json when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/swiss-rail-live/rails.json
          if git diff --cached --quiet; then
            echo "rails.json unchanged"
          else
            git commit -m "Swiss Rail Live: refresh rails.json from OpenStreetMap"
            git push
          fi
